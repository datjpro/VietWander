<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2bee7c",
                        "secondary": "#ff8a3d",
                        "background-light": "#f6f8f7",
                        "background-dark": "#102218",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .bg-gradient-adventure {
            background: linear-gradient(135deg, #2bee7c 0%, #ff8a3d 100%);
        }
        .whimsical-card {
            box-shadow: 0 10px 25px -5px rgba(43, 238, 124, 0.1);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
<!-- Header Section -->
<div class="flex items-center p-4 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-center rounded-full bg-primary/10">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<div class="flex items-center gap-2">
<div class="size-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold">C</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-extrabold leading-tight tracking-tight">CheckViet</h2>
</div>
<div class="size-12"></div>
</div>
<!-- Illustration Hero -->
<div class="@container px-4 py-2">
<div class="relative w-full aspect-[4/3] rounded-xl overflow-hidden bg-primary/5 flex items-center justify-center border-4 border-dashed border-primary/20">
<div class="absolute inset-0 bg-cover bg-center opacity-90" data-alt="Cartoon traveler waving near Halong Bay mountains and dragon" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAnKJ-QMgeTbcSKUdLRs-XQi_BQGRT_kr1eZ5TToNkLN_TEOyjWXO7TDy9uNTLLB18Z3FcfegLRqJ5mhqUW_0U3UP3nN4eK0FSj9LiUNtKNiiVFGne-IMuwETc31QlfJue5Adz4mR9eH1psW9v5DxaAcbQI2vzYWlzor5elmk9-Z8h2lVIRaw79kjSXE80Jd8QF8gchXGjynamfcmijP7EGbZGbX_Q1QJKLRbimjwKd-Zrf1MMnoZVX8M8qZzuLH9oTTHVzHsglgPN7')">
</div>
<!-- Floating Decorative Icons -->
<div class="absolute top-4 left-4 bg-white/80 dark:bg-slate-800/80 p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-secondary">landscape</span>
</div>
<div class="absolute bottom-10 right-4 bg-white/80 dark:bg-slate-800/80 p-2 rounded-full shadow-lg">
<span class="material-symbols-outlined text-primary">sailing</span>
</div>
</div>
</div>
<!-- Text Content -->
<div class="px-6 pt-6 pb-2">
<h1 class="text-slate-900 dark:text-slate-100 text-3xl font-extrabold leading-tight text-center">Chào mừng đến với CheckViet!</h1>
<p class="text-slate-600 dark:text-slate-400 text-base font-medium leading-normal pt-2 text-center">
                Thu thập 63 tỉnh, trở thành Nhà thám hiểm Việt Nam! 🇻🇳
            </p>
</div>
<!-- Registration Form -->
<div class="flex flex-col gap-4 px-6 py-4">
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-bold px-1">Tên người dùng</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">person</span>
<input class="form-input flex w-full rounded-xl border-2 border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-4 focus:ring-primary/10 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base font-medium transition-all" placeholder="Nhập tên thám hiểm của bạn" type="text"/>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-bold px-1">Email</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">mail</span>
<input class="form-input flex w-full rounded-xl border-2 border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-4 focus:ring-primary/10 h-14 pl-12 pr-4 placeholder:text-slate-400 text-base font-medium transition-all" placeholder="Email nhận huy hiệu" type="email"/>
</div>
</label>
<label class="flex flex-col gap-2">
<span class="text-slate-700 dark:text-slate-300 text-sm font-bold px-1">Mật khẩu</span>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-primary">lock</span>
<input class="form-input flex w-full rounded-xl border-2 border-primary/20 bg-white dark:bg-background-dark focus:border-primary focus:ring-4 focus:ring-primary/10 h-14 pl-12 pr-12 placeholder:text-slate-400 text-base font-medium transition-all" placeholder="Tạo mật khẩu bảo mật" type="password"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-slate-400">visibility</span>
</div>
</label>
</div>
<!-- Submit Button -->
<div class="px-6 py-4">
<button class="w-full bg-gradient-adventure hover:opacity-90 text-white font-bold text-lg h-16 rounded-xl shadow-lg shadow-primary/25 transition-transform active:scale-95 flex items-center justify-center gap-2">
<span>Bắt đầu khám phá!</span>
<span class="material-symbols-outlined">rocket_launch</span>
</button>
</div>
<!-- Social Signup -->
<div class="px-6 py-4 flex flex-col items-center gap-4">
<div class="flex items-center gap-4 w-full">
<div class="h-[1px] bg-slate-200 dark:bg-slate-800 flex-1"></div>
<span class="text-slate-400 text-xs font-bold uppercase tracking-widest">Hoặc đăng ký với</span>
<div class="h-[1px] bg-slate-200 dark:bg-slate-800 flex-1"></div>
</div>
<div class="flex gap-4 w-full">
<button class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 h-14 rounded-xl font-bold transition-all hover:border-primary/50">
<img alt="Google" class="size-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBGQeQ3nXk-NydSUBRxowDlBEefuD1dBG1qRHviZ_SEL1KKDdNbReTOi_TIqLIx8DxrcLkLMnv2xw3Wv6ef24aaaFkp-kGbpYbXhmcYh9wIw-iuQjdCAwnbOWsl0d_iFF2ZqU-ZinFCZU3wt-KOostVFvhFu6PDrrRl_e-RwA8VNP6Jqj53SLkaGTXDvWyMGt7jnui1bJXLwAryNUIBYA4dcuuEZhH7YHRnUT6pbS7aJKnrKOC6TlDq2EG-S8TCYk0AXDt95C7ZBHcF"/>
<span>Google</span>
</button>
<button class="flex-1 flex items-center justify-center gap-2 bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 h-14 rounded-xl font-bold transition-all hover:border-primary/50">
<span class="material-symbols-outlined text-blue-600">social_leaderboard</span>
<span>Facebook</span>
</button>
</div>
</div>
<!-- Footer Link -->
<div class="px-6 py-8 text-center">
<p class="text-slate-600 dark:text-slate-400 font-medium">
                Đã có bản đồ hành trình? 
                <a class="text-primary font-bold hover:underline" href="#">Đăng nhập ngay</a>
</p>
</div>
<div class="h-8"></div>
</div>
</body></html>
